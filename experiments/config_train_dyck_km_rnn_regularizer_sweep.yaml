experiment: 
  task: 'DyckKM'
  seed: 324
  n_runs: 1
  comment: 'rmv_first_sing_vec_bigger_range'

sweep:
  min_scale: 0
  max_scale: 50
  n_scales: 10

# Remove max length - depends on k. Relationship is in train.py
data:
  k: 2
  m: 4
  alpha: 0.9

# Remove hidden size - depends on k and m. Relationship is in train.py
model:
  model_class: 'Recurrent'
  cell_type: 'linear'
  readout_depth : 1
  init_scale: 0.2
  
optimizer:
  name: adam
  learning_rate: 1.0e-3
  regularizer: 'svd'

training:
  validation_size: 32768
  batch_size: 128
  batches_per_epoch: 8192
  max_counter: 3

checkpointing:
  save_dir: checkpoints/