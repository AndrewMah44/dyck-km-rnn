experiment: 
  task: "DyckKM"
  seed: 324
  n_runs: 5

# Remove max length - depends on k. Relationship is in train.py
data:
  k: 2
  m: 4
  alpha: 0.9

# Remove hidden size - depends on k and m. Relationship is in train.py
model:
  model_class: 'Recurrent'
  cell_type: 'gru'
  readout_depth : 0
  init_scale: 0.2
  hidden_size: 24

optimizer:
  name: adam
  learning_rate: 1.0e-3

training:
  validation_size: 32768
  batch_size: 128
  batches_per_epoch: 8192
  max_counter: 3

checkpointing:
  save_dir: checkpoints/
