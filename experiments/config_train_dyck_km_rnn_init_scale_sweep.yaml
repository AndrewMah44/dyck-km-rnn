experiment: 
  task: "DyckKM"
  seed: 324
  n_runs: 1

sweep:
  init_scale: [0.01 , 0.035, 0.06 , 0.085, 0.11 , 0.135, 0.16 , 0.185, 0.21 ,
       0.235, 0.26 , 0.285, 0.3]

# Remove max length - depends on k. Relationship is in train.py
data:
  k: 2
  m: 4
  alpha: 0.9

# Remove hidden size - depends on k and m. Relationship is in train.py
model:
  model_class: 'Recurrent'
  cell_type: 'linear'
  readout_depth : 1

optimizer:
  name: adam
  learning_rate: 1.0e-3

training:
  validation_size: 32768
  batch_size: 128
  batches_per_epoch: 8192
  max_counter: 3

checkpointing:
  save_dir: checkpoints/