experiment: 
  task: "DyckKM"
  seed: 324
  n_runs: 1

sweep:
  min_scale: 0.1
  max_scale: 0.9
  n_scales: 9

# Remove max length - depends on k. Relationship is in train.py
data:
  k: 4
  m: 4
  alpha: 0.9

# Remove hidden size - depends on k and m. Relationship is in train.py
model:
  model_class: 'Recurrent'
  cell_type: 'linear'
  readout_depth : 1

optimizer:
  name: adam
  learning_rate: 1.0e-3

training:
  validation_size: 32768
  batch_size: 128
  batches_per_epoch: 8192
  max_counter: 3

checkpointing:
  save_dir: checkpoints/