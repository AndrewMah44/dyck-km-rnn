experiment: 
  task: "DyckKM"
  seed: 324

data:
  k: 2
  m: 5
  min_length: 1
  max_length: 84
  alpha: 0.9

model:
  class: "LinearRNN"
  hidden_size: 64
  readout_depth : 0
  init_scale: 0.9

optimizer:
  name: adam
  learning_rate: 1.0e-3

training:
  validation_size: 32768
  batch_size: 128
  batches_per_epoch: 8192
  max_counter: 3

checkpointing:
  save_dir: checkpoints/